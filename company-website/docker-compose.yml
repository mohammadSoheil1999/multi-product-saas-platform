services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: company, POSTGRES_USER: company, POSTGRES_PASSWORD: company }
    ports: ["5434:5432"]
    volumes: ["company_postgres:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U company"], interval: 5s, timeout: 3s, retries: 20 }
  web:
    build: .
    profiles: ["app"]
    env_file: .env
    ports: ["3000:3000"]
    depends_on: { postgres: { condition: service_healthy } }
  ecommerce-postgres:
    image: postgres:17-alpine
    profiles: ["products"]
    environment: { POSTGRES_DB: ecommerce, POSTGRES_USER: ecommerce, POSTGRES_PASSWORD: ecommerce }
    ports: ["5435:5432"]
    volumes: ["ecommerce_postgres:/var/lib/postgresql/data"]
  realestate-postgres:
    image: postgres:17-alpine
    profiles: ["products"]
    environment: { POSTGRES_DB: realestate, POSTGRES_USER: realestate, POSTGRES_PASSWORD: realestate }
    ports: ["5436:5432"]
    volumes: ["realestate_postgres:/var/lib/postgresql/data"]
volumes: { company_postgres: {}, ecommerce_postgres: {}, realestate_postgres: {} }
