name: CI
on: [pull_request, push]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: company_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/company_test
      AUTH_SECRET: ci-secret-value-at-least-32-characters
      APP_URL: http://localhost:3000
      PAYMENT_PROVIDER: mock
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: company-website/package-lock.json }
      - working-directory: company-website
        run: npm ci
      - working-directory: company-website
        run: npm run db:generate
      - working-directory: company-website
        run: npm run db:migrate:deploy
      - working-directory: company-website
        run: npm run lint && npm run typecheck && npm test && npm run build
